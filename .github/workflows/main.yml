name: Build Zrythm v1 (GTK4 + Carla) for Windows

on:
  push:
    branches: [ v1 ]
  pull_request:
    branches: [ v1 ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022  # Windows 11 compatible runner

    steps:
      # 1. Checkout the v1 branch
      - name: Checkout Zrythm v1
        uses: actions/checkout@v4
        with:
          ref: v1

      # 2. Install MSYS2 and required packages
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-carla
            mingw-w64-x86_64-lv2
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-jack
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-libcyaml
            unzip
            wget
            rsync

      # 3. Install Python dependencies for Meson & build scripts
      - name: Install Python packages
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      # 4. Configure Meson build (optimized for Windows + Carla + GTK4)
      - name: Meson setup
        shell: msys2 {0}
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/mingw64 \
            -Dtests=false \
            -Dmanpage=false \
            -Ddoxygen=false \
            -Dprofiling=false \
            -Dgui_tests=false \
            -Dcarla=enabled \
            -Djack=enabled \
            -Dportaudio=enabled \
            -Drtaudio=disabled \
            -Dpipewire=disabled \
            -Dpulse=disabled \
            -Dflatpak=disabled \
            -Dstatic_deps=disabled \
            -Doptimization=3 \
            -Db_lto=true \
            -Db_pie=true

      # 5. Compile (using all CPU cores for speed)
      - name: Compile Zrythm
        shell: msys2 {0}
        run: |
          meson compile -C build -j$(nproc)

      # 6. Install into staging directory
      - name: Meson install
        shell: msys2 {0}
        run: |
          meson install -C build --destdir=staging

      # 7. Create portable .zip and .exe installer
      - name: Package artifacts
        shell: msys2 {0}
        run: |
          cd staging/mingw64
          mv bin/zrythm.exe zrythm.exe
          # Create portable zip
          zip -r ../../zrythm-windows-portable.zip .
          # Create self-extracting installer with 7-Zip
          7z a -sfx7zSD.sfx ../../zrythm-windows-installer.exe .

      # 8. Upload artifacts so you can download them
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-v1-windows
          path: |
            zrythm-windows-portable.zip
            zrythm-windows-installer.exe
          retention-days: 14

      # 9. Show success message with download instructions
      - name: Build complete
        shell: msys2 {0}
        run: |
          echo "Build finished successfully!"
          echo "Download artifacts from the Actions summary page:"
          echo "  - Portable version: zrythm-windows-portable.zip"
          echo "  - Installer: zrythm-windows-installer.exe"
