name: Build Zrythm v1 (GTK4 + Carla) for Windows

on:
  push:
    branches: [ v1 ]
  pull_request:
    branches: [ v1 ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Zrythm v1
        uses: actions/checkout@v4
        with:
          ref: v1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      # Batch 1: Core audio/graphics deps
      - name: Install core dependencies (batch 1)
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gtk4 \
            mingw-w64-x86_64-libadwaita \
            mingw-w64-x86_64-gtksourceview5 \
            mingw-w64-x86_64-carla \
            mingw-w64-x86_64-lv2 \
            mingw-w64-x86_64-lilv \
            mingw-w64-x86_64-serd \
            mingw-w64-x86_64-sord \
            mingw-w64-x86_64-sratom

      # Batch 2: Audio backends and utilities
      - name: Install core dependencies (batch 2)
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-jack \
            mingw-w64-x86_64-portaudio \
            mingw-w64-x86_64-rubberband \
            mingw-w64-x86_64-libsamplerate \
            mingw-w64-x86_64-fftw \
            mingw-w64-x86_64-libyaml \
            mingw-w64-x86_64-pcre2 \
            mingw-w64-x86_64-json-glib \
            mingw-w64-x86_64-python \
            mingw-w64-x86_64-gobject-introspection \
            mingw-w64-x86_64-libcyaml

      # Batch 3: Extra tools (rarely cause issues)
      - name: Install extra tools
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            unzip wget rsync

      # Final safety update + keyring refresh (helps with recent flakiness)
      - name: Final system update and keyring refresh
        shell: msys2 {0}
        run: |
          pacman-key --refresh-keys || true
          pacman -Syu --noconfirm

      # Install Python tools (meson/ninja via pip for latest versions)
      - name: Install Python packages
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      # Meson setup
      - name: Meson setup
        shell: msys2 {0}
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/mingw64 \
            -Dtests=false \
            -Dmanpage=false \
            -Ddoxygen=false \
            -Dprofiling=false \
            -Dgui_tests=false \
            -Dcarla=enabled \
            -Djack=enabled \
            -Dportaudio=enabled \
            -Drtaudio=disabled \
            -Dpipewire=disabled \
            -Dpulse=disabled \
            -Dflatpak=disabled \
            -Dstatic_deps=disabled \
            -Doptimization=3 \
            -Db_lto=true \
            -Db_pie=true

      # Compile
      - name: Compile Zrythm
        shell: msys2 {0}
        run: |
          meson compile -C build -j$(nproc)

      # Install to staging
      - name: Meson install
        shell: msys2 {0}
        run: |
          meson install -C build --destdir=staging

      # Package
      - name: Package artifacts
        shell: msys2 {0}
        run: |
          cd staging/mingw64
          zip -r ../../zrythm-windows-portable.zip .
          7z a -sfx7z.sfx ../../zrythm-windows-installer.exe .

      # Upload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-v1-windows
          path: |
            zrythm-windows-portable.zip
            zrythm-windows-installer.exe
